[package]
name = "envpilot"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
iced = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
dirs = "6"
