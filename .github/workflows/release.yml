name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Check version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "v$VERSION" = "$GITHUB_REF_NAME"
          test "$VERSION" = "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' packaging/macos/Info.plist)"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: ./scripts/build-macos.sh ${{ matrix.arch }} && ./scripts/package-macos.sh ${{ matrix.arch }} && ./scripts/generate-dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Create release without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.dmg | sed 's|  ./|  |' > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" ./*.dmg SHA256SUMS.txt --verify-tag --generate-notes --notes 'These builds are unsigned and not notarized; Gatekeeper verification is not claimed.'
